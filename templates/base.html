<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Beschaffung{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css?v=12">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/">Beschaffung</a>
    <nav aria-label="Hauptnavigation">
      <a href="/">Jobs</a>
      <a href="/history">Historie</a>
      <a href="/shops">Shops</a>
      <a href="/bestand">Bestand</a>
    </nav>
    <footer>
      {% set update = update_release() %}
      {% if update %}
      <a class="update" href="{{ update.url }}">Update verfügbar: {{ update.tag }}</a>
      {% endif %}
      <nav aria-label="Quellcode">
        v{{ app_version }} · <a href="https://github.com/Flashbibi/i-dont-wanna-research-stuff">Source (AGPL-3.0)</a>
      </nav>
    </footer>
  </aside>
  <main>{% block content %}{% endblock %}</main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
