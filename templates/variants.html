{% extends "base.html" %}
{% block title %}Varianten Job #{{ job_id }}{% endblock %}
{% block content %}
<div class="section-head"><div><p class="eyebrow">Job #{{ job_id }}</p><h1>Bestellvarianten</h1></div><a class="button" href="/jobs/{{ job_id }}">Zurück zu Kandidaten</a></div>
<section class="panel slider-panel">
  <label for="tempo"><span>Billig</span><strong id="tempo-value">50%</strong><span>Schnell</span></label>
  <input id="tempo" type="range" min="0" max="1" step="0.05" value="0.5" data-job="{{ job_id }}">
</section>
<div id="variants" class="variants"><p class="muted">Varianten werden gerechnet…</p></div>
{% endblock %}
{% block scripts %}<script src="/static/variants.js"></script>{% endblock %}
