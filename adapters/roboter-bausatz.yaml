schema: 1
id: roboter-bausatz
domain: roboter-bausatz.de
notes: >
  Shopware product pages with quantity tiers. The price selector targets only
  the highlighted single-unit row and excludes cheaper bulk tiers.
product:
  url_pattern: "^https://(www\\.)?roboter-bausatz\\.de/p/[a-z0-9][a-z0-9-]*$"
  fields:
    produktname:
      selector: ".product-detail-buy h1.product-detail-name"
    preis:
      selector: ".product-detail-buy .product-block-prices-body > .product-block-prices-row:first-child td.product-block-prices-cell"
      parse: price
    lieferzeit_text:
      selector: ".product-detail-buy .product-detail-delivery-information .delivery-information"
      optional: true
    artikelnummer:
      selector: ".product-detail-buy [itemprop=sku]"
      optional: true
