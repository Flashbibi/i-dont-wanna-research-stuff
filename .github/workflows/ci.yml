name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beschaffung
          POSTGRES_PASSWORD: beschaffung
          POSTGRES_DB: beschaffung
        ports:
          # Trifft den DEV_URL-Default der Integrationstests. Deshalb braucht
          # der Lauf kein BESCHAFFUNG_TEST_DATABASE_URL.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U beschaffung -d beschaffung"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Integrationstests gegen Postgres
        run: |
          set -o pipefail
          python -m pytest tests/test_repository_integration.py -v | tee integration.log

      - name: Guard - die Datenbankverifikation muss gelaufen sein
        run: |
          if ! grep -q "19 passed" integration.log; then
            echo "Erwartet waren 19 bestandene Integrationstests."
            exit 1
          fi
          if grep -qE "SKIPPED| skipped" integration.log; then
            echo "Ohne erreichbares Postgres überspringen sich diese Tests still."
            echo "Ein Skip zählt hier nicht als grün:"
            grep -nE "SKIPPED| skipped" integration.log
            exit 1
          fi

      - name: Gesamte Testsuite
        run: |
          set -o pipefail
          python -m pytest -ra | tee suite.log

      - name: Guard - kein stiller Skip in der Suite
        run: |
          if grep -q " skipped" suite.log; then
            echo "Die Suite hat Tests übersprungen:"
            grep -n " skipped" suite.log
            exit 1
          fi
